[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfiler"
version = "0.2.5"
description = "A zero-dependency Python filesystem toolkit for files, folders, searching, metadata, hashing, comparisons, directory trees, storage setup, and safe rooted exploration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Leila150" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
